  - generic [ref=e88]:
    - heading "11. Account Deletion" [level=2] [ref=e89]
    - paragraph [ref=e90]: If you wish to delete your Fixxly account and associated personal information, please contact our support team at care@fixxly.in.
  - generic [ref=e91]:
    - heading "12. Changes" [level=2] [ref=e92]
    - paragraph [ref=e93]: We will update this Notice when our processing changes — in particular before introducing any new device permission, any location-based function, or any new category of monitoring. Material changes will be notified in-App or through your supervisor before taking effect.
