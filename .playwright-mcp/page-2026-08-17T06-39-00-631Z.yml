    - paragraph [ref=e58]: We will not use your personal information for a purpose materially different from those stated above without seeking your fresh consent, in line with the DPDPA purpose-limitation principle.
  - generic [ref=e59]:
    - heading "4. Disclosure & Sharing" [level=2] [ref=e60]
    - paragraph [ref=e61]: "We may share your information, only to the extent necessary, with:"
    - list [ref=e62]:
      - listitem [ref=e63]: Group companies & affiliates, for internal administration and service improvement, subject to this Policy;
      - listitem [ref=e64]: Velobrix and Logistics Partners, limited to the details necessary to fulfil your order (name, contact number, curbside or site delivery address, order details), as Velobrix is the seller of record for your purchase;
      - listitem [ref=e65]: Our payment aggregator (a Reserve Bank of India authorised entity engaged by Velobrix from time to time), to process payments and refunds securely to and from Velobrix, the beneficiary of such payments;
      - listitem [ref=e66]: Third-party service providers, such as cloud hosting, validation vendors (GSTIN API validation loops), analytics, SMS/WhatsApp/notification providers, and customer support tools, who are contractually bound to use your information only for the purpose we specify and to maintain confidentiality;
      - listitem [ref=e67]: Law enforcement or government authorities, where required by law, a valid legal process, or to protect the rights, safety, or property of Fixxly, our Users, or the public;
      - listitem [ref=e68]: Professional advisors (auditors, legal counsel) as needed for legitimate business purposes;
      - listitem [ref=e69]: A successor entity, in the event of a merger, acquisition, or restructuring, subject to that entity honouring this Policy.
    - paragraph [ref=e70]: We do not sell your personal information to third parties for their independent marketing use. Your personal information may be stored, processed, or accessed from servers located outside India. In accordance with Section 16 of the DPDPA, we may transfer personal information outside India, except to countries or territories restricted by the Central Government by notification.
  - generic [ref=e71]:
    - heading "5. Data Retention & Deletion" [level=2] [ref=e72]
    - paragraph [ref=e73]: We retain your personal information only for as long as reasonably necessary to fulfil the purposes described in this Policy, or as required to comply with applicable law (including tax and accounting record-keeping requirements), whichever is longer.
    - paragraph [ref=e74]: "Right to Erasure: In line with the DPDPA, you may request deletion of your personal information at any time by writing to our Grievance Officer (Section 10) or through the \"Delete my account\" option in the app, where available. We will act on your request unless we are required to retain certain data:"
    - list [ref=e75]:
      - listitem [ref=e76]: to complete a transaction already in progress;
      - listitem [ref=e77]: to comply with a legal or regulatory obligation (e.g., invoicing/tax records);
      - listitem [ref=e78]: for the establishment, exercise, or defence of a legal claim.
    - paragraph [ref=e79]: Upon account deletion, we will remove or anonymize your personal information within the timelines prescribed under applicable law, except for the retained categories described above.
  - generic [ref=e80]:
    - heading "6. Information Security" [level=2] [ref=e81]
    - paragraph [ref=e82]: We implement reasonable managerial, technical, operational, and electronic security safeguards appropriate to the sensitivity of the information we hold, including encryption in transit, access controls, and regular security reviews, in line with the Information Technology (Reasonable Security Practices and Procedures and Sensitive Personal Data or Information) Rules, 2011.
    - paragraph [ref=e83]: No method of transmission over the internet or electronic storage is 100% secure. While we strive to protect your personal information, we cannot guarantee its absolute security. In the unlikely event of a data breach that affects you, we will notify you and the relevant authorities as required under applicable law.
  - generic [ref=e84]:
    - heading "7. Right to Withdraw Consent & Statutory Data Rights" [level=2] [ref=e85]
    - paragraph [ref=e86]: You may withdraw your consent to any processing activity that relies on consent (such as background location tracking or marketing communications) at any time. Withdrawal is configured to be as easy as giving consent.
    - list [ref=e87]:
      - listitem [ref=e88]: "Direct Controls: You can disable location/notification permissions from your device settings, or opt out of promotional messages via the link/option provided in the communication, or by writing to us."
      - listitem [ref=e89]: "General Withdrawal: You can request withdrawal of consent generally by contacting our Grievance Officer (Section 10) on a standard Business Day. Please note that withdrawing consent for certain data (e.g., precise location) may limit or disable core features such as live order tracking or delivery dispatch. Withdrawal will not affect the lawfulness of processing carried out before such withdrawal, and we may continue to retain and use information as permitted under Section 5 (Data Retention) or as required by law."
      - listitem [ref=e90]: "Consent Managers under DPDPA: In accordance with the DPDPA, you have the statutory right to give, manage, review, or completely withdraw your consent through an independently registered \"Consent Manager\". Fixxly is deploying the technical framework and APIs needed to integrate with authorized Consent Manager platforms as they become operationalized by the Data Protection Board of India (DPBI). Until Consent Manager platforms are broadly available, you can manage your active data permissions via your Fixxly Account Privacy Dashboard or by issuing a direct request to our Grievance Officer."
      - listitem [ref=e91]: "Right to Access: In accordance with Section 11 of the DPDPA, you have the right to obtain from us, on request to our Grievance Officer, a summary of the personal information we are processing about you and of the processing activities undertaken in respect of such information;"
      - listitem [ref=e92]: "Right to Nominate: You have the right to nominate, in a prescribed manner, any other individual to exercise your data principal rights (including the right to access, correct, complete, or erase your digital personal data) on your behalf, in the event of your death or incapacity."
    - paragraph [ref=e93]: You may register, modify, or update your nominee details via the "Nomination and Authorization" form available within your profile settings or by contacting the Grievance Officer.
  - generic [ref=e94]:
    - heading "8. Cookies & Tracking Policy" [level=2] [ref=e95]
    - paragraph [ref=e96]: "Our website uses cookies, web beacons, and similar analytical tools to:"
    - list [ref=e97]:
      - listitem [ref=e98]: Remember your preferences and login state;
      - listitem [ref=e99]: Understand usage patterns and improve site performance;
      - listitem [ref=e100]: Measure the effectiveness of promotional campaigns.
    - paragraph [ref=e101]: You can control or disable cookies through your browser settings. Disabling cookies may affect certain website functionality. We do not use cookies to collect sensitive personal data without your consent.
  - generic [ref=e102]:
    - heading "9. Minors Policy" [level=2] [ref=e103]
    - paragraph [ref=e104]: The Platform is intended solely for use by individuals who are 18 years of age or older. We do not knowingly collect personal information from children. If we become aware that we have inadvertently collected personal information from a minor, we will delete such information and, where applicable, deactivate the associated account promptly. If you believe a minor has provided us with personal information, please contact our Grievance Officer immediately.
