- main [ref=e3]:
  - heading "Privacy Policy" [level=1] [ref=e5]
  - paragraph [ref=e6]: "Last Updated: 17-08-2026"
  - generic [ref=e7]:
    - heading "1. Introduction & Consent" [level=2] [ref=e8]
    - paragraph [ref=e9]: Fixxly Private Limited ("Company", "Fixxly", "we", "us", "our") is committed to protecting the privacy of individuals who access or use our mobile application and website (together, the "Platform"). The term "you" or "your" refer to the users of this Platform. This Privacy Policy ("Policy") explains what personal information we collect, why we collect it, how we use and protect it, and the rights available to you as a "Data Principal" under the Digital Personal Data Protection Act, 2023 ("DPDPA").
    - paragraph [ref=e10]: Separately, Velobrix Retail Private Limited ("Velobrix"), an independent Indian company registered under GSTIN 29AAMCV4271F1ZY, having its registered office at Bay 4, 4th Floor, Nos. 45/1 and 45/2, Mantri Junction, 45th Cross, JP Nagar Phase 2, Bengaluru, Bengaluru Urban, Karnataka 560078, is the seller of record for products purchased through the Platform and receives certain personal information from us in that capacity, as described in Section 4 below. This Policy governs Fixxly's collection and processing of your personal information as the Platform operator; Velobrix's own handling of information it receives is subject to Velobrix's obligations under applicable law.
    - paragraph [ref=e11]: This Policy is an electronic record under the Information Technology Act, 2000 ("IT Act") and does not require any physical or digital signature. It should be read together with our Terms of Use. Capitalized terms not defined here have the meaning given in the Terms of Use.
    - paragraph [ref=e12]: By accessing or using the Platform, registering an account, or providing your information to us, you consent to the collection, transfer, use, storage, sharing, and disclosure of your personal information as described in this Policy. If you do not agree with this Policy, please do not use or access the Platform. Where we rely on your consent for a specific processing activity (e.g., sending promotional communications, background location tracking), we will seek that consent separately and specifically, in line with DPDPA requirements for clear, informed, and purpose-specific consent.
    - paragraph [ref=e13]: If you are providing personal information about another individual (e.g., a colleague, or a recipient at your delivery site), you confirm that you have their permission to share such information with us for the purposes described in this Policy.
  - generic [ref=e14]:
    - heading "2. Information We Collect" [level=2] [ref=e15]
    - paragraph [ref=e16]: "We collect only as much personal information as is reasonably necessary for the purposes described in this Policy (\"data minimization\"). This may include:"
    - list [ref=e17]:
      - listitem [ref=e18]: "Personal Information: Name, mobile number, email address, business/trade name, and profile photo (optional); government-issued identification or KYC details, where required for onboarding or fraud checks; GST registration number, where you access GST-linked features or prompts."
      - listitem [ref=e19]: "Transactional Data: Order history, product preferences, delivery addresses, payment method (we do not store full card numbers — these are processed by our PCI-DSS compliant payment partners), invoices, and communications with customer support."
      - listitem [ref=e20]: "Precise & Background Location Data: With your permission, we collect precise GPS location to determine Velobrix-to-site delivery routing, show real-time order tracking, and estimate delivery time. Where you enable background location access, we may continue to receive location updates while the app is not in active use, solely to improve dispatch accuracy and delivery estimated time of arrival (\"ETA\") for an active order. Background tracking is not used outside the context of an active or recent order, and you can disable it at any time from your device settings (see Section 7)."
      - listitem [ref=e21]: "Device & Usage Data: Device model, operating system, IP address, browser type, app version, crash logs, and general usage patterns (pages/screens viewed, session duration)."
      - listitem [ref=e22]: "Cookies & Similar Technologies: On our website, we use cookies and similar tracking technologies as described in Section 8."
    - paragraph [ref=e23]: If you choose not to provide certain information (e.g., precise location or KYC details), we may not be able to complete your registration or fulfil certain orders.
