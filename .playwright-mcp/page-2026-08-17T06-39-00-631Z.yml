  - generic [ref=e135]:
    - heading "11. Changes to This Policy" [level=2] [ref=e136]
    - paragraph [ref=e137]: We may update this Policy from time to time to reflect changes in our practices or applicable law. The updated Policy will be posted on the Platform with a revised "Last Updated" date, and your continued use of the Platform after such changes constitutes your consent and acceptance of the updated Policy. For material changes affecting how we use your personal information, we will make reasonable efforts to notify you directly (e.g., via in-app notice or email) before the change takes effect.
